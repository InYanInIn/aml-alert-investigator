<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111518">
<title>{% block title %}AML Alert Investigator{% endblock %}</title>
<link rel="stylesheet" href="/static/workspace/theme.css">
<link rel="stylesheet" href="/static/workspace/analyst.css">
</head>
<body>
<header class="masthead">
<a class="brand" href="/"><span class="signal" aria-hidden="true"></span><span>AML <strong>Investigator</strong></span></a>
<nav aria-label="Workspace">
{% if ui_mode %}<a href="/world">World</a>{% endif %}
<a href="/" aria-current="page">Analyst</a>
</nav>
</header>
<main class="workspace analyst">
<nav class="analyst-nav" aria-label="Analyst views">
{% for path, label in [("/", "Queue"), ("/auto-closed", "Auto-closed"), ("/alerts", "All alerts")] %}
<a href="{{ path }}"{% if request.url.path == path or (path == "/alerts" and request.url.path.startswith("/alerts/")) %} aria-current="page"{% endif %}>{{ label }}</a>
{% endfor %}
</nav>
{% block content %}{% endblock %}
</main>
</body>
</html>
