image:
  repository: aml-investigator
  tag: dev
  pullPolicy: IfNotPresent

database: aml_hi_small

api:
  enabled: true
  port: 8000
  secretName: aml-api
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}

mcp:
  enabled: true
  port: 8100
  secretName: aml-mcp
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

ui:
  enabled: false
  port: 8765
  secretName: aml-ui
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1536Mi}

postgres:
  image: pgvector/pgvector:pg16
  secretName: aml-postgres
  storage: 8Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

azure:
  openaiEndpoint: ""
  subscriptionId: ""
  tenantId: ""
  workloadIdentityClientId: ""
  keyVaultName: ""
