[project]
name = "aml-investigator"
version = "0.1.0"
description = "LLM agent that prepares AML alert investigations for analyst review, evaluated against hidden labels."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "fastmcp>=4.0,<5",
    "jinja2>=3.1,<4",
    "langchain[mcp]>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "polars>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
aml = "aml_investigator.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-10-14T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N", "S", "PT", "ARG", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error", "ignore:`langchain.mcp` is in beta:langchain_core._api.LangChainBetaWarning"]
